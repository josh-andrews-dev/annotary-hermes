name: Bug report
description: Something in annotary-hermes does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the report. A security problem goes to private vulnerability reporting
        (SECURITY.md), never a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version you ran, or the commit you built.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and version.
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Error messages or log lines, with anything private removed.
      render: text
