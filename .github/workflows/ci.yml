# Rendered from the repo-standard template; never edited in this repo. The job name `ci` is the
# required status check in the repo's ruleset, so it is fixed and has no path filters. It runs
# on a GitHub-hosted runner: the repo is public, and a self-hosted runner registered to it would
# run a fork's pull request code on a home machine.
name: ci

on:
  pull_request:
    # `edited` reruns the check when only the title changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_PLATFORM: linux_x64
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full history for gitleaks' scan; on the runner's persistent workspace the fetch only adds
      # new commits (about a second, measured 2026-10-18).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The title becomes the squash-merge subject on main; the commit-msg hook checks it with
      # --title, which gives a merge, fixup or revert subject no pass. The title goes through env,
      # never into the script text.
      - name: pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          .githooks/commit-msg --title "$RUNNER_TEMP/title"
      # A hosted runner starts empty, so "gitleaks download" fetches the pinned gitleaks on every
      # run and checks its sha256 (the same script as on a home runner, whose disk persists). The
      # scan also puts it on the PATH, for a repo whose `make ci` runs gitleaks by name (a test of
      # the pre-commit hook); most repos' `make ci` does not.
      - name: gitleaks cache
        id: gitleaks
        run: scripts/standard/gitleaks.sh check
      - name: gitleaks download
        if: steps.gitleaks.outputs.hit != 'true'
        run: scripts/standard/gitleaks.sh fetch
      - name: gitleaks
        run: scripts/standard/gitleaks.sh scan
      # `make ci` runs codespell through uvx (scripts/standard/en_us.py), and a hosted runner has no
      # uv. On the home runner it is on the host.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
      - name: make ci
        run: make ci
