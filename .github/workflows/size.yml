# The `size` check (docs/size-report.md), a required status check: it compares
# perf/size-report.json at the pull request's base and head, and fails when any number is larger
# unless the body has a `Size growth: <why>` line, and always when a number is above its ceiling.
# The `ci` job's `make test` (tests/test_size_report.py) holds the committed file equal to what the
# plugin sends. Nothing of the pull request runs here, so it cannot loosen the check in the change
# that grows a number: pull_request_target takes this file from the default branch (a
# pull_request run would take the pull request's own copy), and the script comes from the pull
# request's base; `ci` tests the head's copy. The pull_request trigger stays only until the next
# pull request removes it: a required check moved to pull_request_target in one pull request
# runs on neither event for that pull request. A change to the report's shape therefore lands in
# the script first. Read-only token; the two reports are fetched through the API and validated as
# data. Editing the body runs it again. GitHub-hosted runner: the repo is public.
name: size

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: size-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the trusted script (the pull request's base, never its head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/size-report.cjs').check({ github, context, core });
