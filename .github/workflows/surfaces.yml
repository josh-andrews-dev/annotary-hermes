# Rendered from the repo-standard template; never edited in this repo. It exists while
# .agents/standard.yml records two or more surfaces. The job name `surfaces` is a required status
# check in the repo's ruleset: a pull request titled feat, fix or perf merges only once its body's
# `## Surfaces` section has one line per surface, `changed`, `not affected: <why>` or
# `follows: <reason>` (scripts/standard/surfaces.py says which reasons). Other titles pass. Editing
# the body runs it again. The checkout is full, never sparse: a self-hosted runner shares this
# workspace with `ci`, and a sparse checkout there stays sparse for the next job (RS-58). It runs
# on a GitHub-hosted runner: the repo is public.
name: surfaces

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: surfaces-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  surfaces:
    name: surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A workspace the v0.18.0 workflow checked out sparse keeps core.sparseCheckout in
      # .git/config, which actions/checkout's `sparse-checkout disable` does not clear (RS-58).
      - name: clear a sparse checkout left in this workspace
        run: |
          if [ -d .git ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all core.sparseCheckoutCone || true
            rm -f .git/info/sparse-checkout
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The title and body go through env, never into the script text.
      - name: surfaces section
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/standard/surfaces.py pr
